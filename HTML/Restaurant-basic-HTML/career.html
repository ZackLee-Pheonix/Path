<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career</title>
  </head>
  <body>
    <header>
      <div>
        <a href="index.html">
          <img
            src="./images/Andys_logo.png"
            alt="Adys Logo"
            height="100px"
            width="100px"
          />
        </a>
        <nav>
          <a href="shop.html"> Shop </a>
          <a href="restaurants.html"> Restaurants </a>
          <a href="news.html"> News </a>
          <a href="career.html"> Career </a>
        </nav>
      </div>
    </header>
    <main>
      <h2>Career</h2>
      <section>
        <h3>Fill out the application form below</h3>
        <form>
          <label for="username">Your first and last name</label>
          <input id="username" type="text" />
          <label for="age">Your age</label>
          <input id="age" type="number" />
          <label for="tel">Your phone</label>
          <input type="tel" />
          <label for="email">Your email</label>
          <input type="email" />
        </form>
      </section>
      <section>
        <h3>Choose the job</h3>
        <select>
          <option value="administrator">Administrator</option>
          <option value="chelner">Chelner</option>
          <option value="bucatar">Bucatar</option>
          <option value="barmen">Barmen</option>
          <option value="curier">Curier</option>
        </select>
      </section>
      <section>
        <img
          src="./images/careerImage-DD2sVZJr.png"
          alt="Career"
          height="200px"
          width="500px"
        />
      </section>
      <section>
        <h3>What languages ​​do you speak?</h3>
        <label>
          <input type="checkbox" />
          Russian
        </label>
        <label>
          <input type="checkbox" />
          Romanian
        </label>
        <label>
          <input type="checkbox" />
          English
        </label>
      </section>
      <section>
        <h3>How long would you like to work?</h3>
        <label>
          <input type="checkbox" />
          Full-time
        </label>
        <label>
          <input type="checkbox" />
          Part-time
        </label>
      </section>
      <section>
        <h3>Where would you like to work?</h3>
        <label>
          <input type="checkbox" />
          Andy’s Pizza
        </label>
        <label>
          <input type="checkbox" />
          La Placinte
        </label>
        <label>
          <input type="checkbox" />
          Ciao Cacao
        </label>
      </section>
      <button type="submit">Sent resume</button>
    </main>
    <footer>
      <p>
        © 2026 Andy's Pizza Copyright © 2026 Trabo Plus S.R.L. All rights
        reserved.
      </p>
    </footer>
  </body>
</html>
