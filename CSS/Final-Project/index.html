<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Istore</title>
</head>
<body>
    <header class="header">
        <div class="header__logo">
            <a href="#">
                <img src="./images/logo.svg" alt="logo">
            </a>
            <a href="#">
                <img src="./images/auth.svg" alt="auth">
            </a>
        </div>
        <nav>
            <ul class="header__list">
                <li><i class="fa-solid fa-magnifying-glass"></i></li>
                <li><i class="fa-regular fa-clock"></i></li>
                <li><i class="fa-solid fa-phone"></i></li>
                <li><p>ro</p></li>
                <li><i class="fa-solid fa-cart-shopping"></i></li>
                <li><i class="fa-solid fa-bars"></i></li>
            </ul>
        </nav>
    </header>
    <main class="main">
        <section class="main__banner">
            <img src="./images/banner.webp" alt="banner">
        </section>
        <section class="main__catalog">
            <div class="main__catalog__firstrow">
                <div>
                    <img src="./images/iphone.png" alt="iphone">
                    <p>iPhone</p>
                    <a href="#">Vezi toate</a>
                </div>
                <div>
                    <img src="./images/watch.png" alt="watch">
                    <p>Watch</p>
                    <a href="#">Vezi toate</a>
                </div>
            </div>
            <div class="main__catalog__secondrow">
                <img src="./images/macbook.png" alt="macbook">
                <p>Macbook</p>
                <a href="#">Vezi toate</a>
            </div>
            <div class="main__catalog__thirdrow">
                <div>
                    <img src="./images/ipad.png" alt="ipad">
                    <p>iPad</p>
                    <a href="#">Vezi toate</a>
                </div>
                <div>
                    <img src="./images/tv.png" alt="Tv">
                    <p>Tv & Home</p>
                    <a href="#">Vezi toate</a>
                </div>
            </div>
            <div class="main__catalog__forthrow">
                <div>
                    <img src="./images/airpods.png" alt="airpods">
                    <p>AirPods</p>
                    <a href="#">Vezi toate</a>
                </div>
                <div>
                    <img src="./images/keyboard.png" alt="keyboard">
                    <p>Accesorii</p>
                    <a href="#">Vezi toate</a>
                </div>
            </div>
            <div class="main__catalog__fifthrow">
                <img src="./images/mini-pc.png" alt="mac">
                <p>Mac</p>
                <a href="#">Vezi toate</a>
            </div>
        </section>
    </main>
</body>
</html>
