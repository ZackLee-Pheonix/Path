<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Keyboard</title>
</head>
<body>
    <div class="container">
        <div class="keyboard">
            <p class="row1 esc">`</p>
            <p class="row1 nr">1</p>
            <p class="row1 nr">2</p>
            <p class="row1 nr">3</p>
            <p class="row1 nr">4</p>
            <p class="row1 nr">5</p>
            <p class="row1 nr">6</p>
            <p class="row1 nr">7</p>
            <p class="row1 nr">8</p>
            <p class="row1 nr">9</p>
            <p class="row1 nr">0</p>
            <p class="row1 nr">-</p>
            <p class="row1 nr">+</p>
            <p class="row1 twohalf">Delete</p>
            <p class="row2 onehalf">Tab</p>
            <p class="row2 nr">Q</p>
            <p class="row2 nr">W</p>
            <p class="row2 nr">E</p>
            <p class="row2 nr">R</p>
            <p class="row2 nr">T</p>
            <p class="row2 nr">Y</p>
            <p class="row2 nr">U</p>
            <p class="row2 nr">I</p>
            <p class="row2 nr">O</p>
            <p class="row2 nr">P</p>
            <p class="row2 nr">[</p>
            <p class="row2 nr">]</p>
            <p class="row2 onehalf">\</p>
            <p class="row3 two">CapsLk</p>
            <p class="row3 nr">A</p>
            <p class="row3 nr">S</p>
            <p class="row3 nr">D</p>
            <p class="row3 nr">F</p>
            <p class="row3 nr">G</p>
            <p class="row3 nr">H</p>
            <p class="row3 nr">J</p>
            <p class="row3 nr">K</p>
            <p class="row3 nr">L</p>
            <p class="row3 nr">;</p>
            <p class="row3 nr">'</p>
            <p class="row3 two">Return</p>
            <p class="row4 twohalf">Shift</p>
            <p class="row4 nr">Z</p>
            <p class="row4 nr">X</p>
            <p class="row4 nr">C</p>
            <p class="row4 nr">V</p>
            <p class="row4 nr">B</p>
            <p class="row4 nr">N</p>
            <p class="row4 nr">M</p>

            <p class="row4 nr">/</p>
            <p class="row4 twohalf">Shift</p>
            <p class="row5 onehalf">Ctrl</p>
            <p class="row5 nr">Win</p>
            <p class="row5 nr">Alt</p>
            <p class="row5 space">Space</p>
            <p class="row5 onehalf">Alt</p>
            <p class="row5 nr">Fn1</p>
            <p class="row5 nr">Fn2</p>
            <p class="row5 nr">Ctrl</p>
        </div>
    </div>

</html>
