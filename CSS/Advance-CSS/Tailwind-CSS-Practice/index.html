<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Tailwind CSS</title>
</head>
<body>
    <header class="flex items-center justify-between mx-5 py-1">
        <div class="flex items-center gap-1">
            <a href="#">
                <img src="./images/logo.webp" alt="logo" class="h-[100px]">
            </a>
            <select class="text-sm py-1 px-3 border rounded appearance-none bg-white">
                <option>v4.3</option>
                <option>v3.4.17</option>
                <option>v2.2.19</option>
                <option>v1.9.6</option>
                <option>v0.7.4</option>
            </select>
        </div>
        <nav>
            <ul class="flex items-center justify-between gap-6 text-[16px] font-medium">
                <li>Docs</li>
                <li>Blog</li>
                <li>Showcase</li>
                <li>Partners</li>
                <li><i class="fa-brands fa-github"></i></li>
            </ul>
        </nav>
    </header>
</body>
</html>
